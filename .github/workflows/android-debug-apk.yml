name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google has retired the legacy SDK 'tools' package; install platform-tools only.
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;23.2.8568313"
          yes | sdkmanager --licenses
      - name: Install Godot 4.3 editor
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          curl -L --fail --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.3-stable_linux.x86_64
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"
      - name: Install matching Android export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          curl -L --fail --retry 3 -o godot-templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p "$RUNNER_TEMP/godot-templates"
          unzip -q godot-templates.tpz -d "$RUNNER_TEMP/godot-templates"
          if [ -d "$RUNNER_TEMP/godot-templates/templates" ]; then
            cp -R "$RUNNER_TEMP/godot-templates/templates/." "$HOME/.local/share/godot/export_templates/4.3.stable/"
          else
            find "$RUNNER_TEMP/godot-templates" -type f -name 'android_debug.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;
            find "$RUNNER_TEMP/godot-templates" -type f -name 'android_release.apk' -exec cp {} "$HOME/.local/share/godot/export_templates/4.3.stable/" \;
          fi
          echo "4.3.stable" > "$HOME/.local/share/godot/export_templates/4.3.stable/version.txt"
          test -s "$HOME/.local/share/godot/export_templates/4.3.stable/android_debug.apk"
      - name: Configure Android paths and debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot" "$HOME/.android"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          EOF
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
      - name: Import project and export Android debug APK
        shell: bash
        run: |
          mkdir -p build
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          Godot_v4.3-stable_linux.x86_64 --headless --editor --path . --quit
          Godot_v4.3-stable_linux.x86_64 --headless --path . --export-debug "Android" build/Chatpattoytv-RC-Game.apk
          test -s build/Chatpattoytv-RC-Game.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Chatpattoytv-RC-Game-Android-debug
          path: build/Chatpattoytv-RC-Game.apk
          if-no-files-found: error
          retention-days: 14
